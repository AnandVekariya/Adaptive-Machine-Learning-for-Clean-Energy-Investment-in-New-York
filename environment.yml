# Cross-platform environment (Windows, macOS, Linux).
# Conda-forge ships GDAL / PROJ / GEOS wheels so geospatial installs work
# without a system compiler.
#
#   conda env create -f environment.yml
#   conda activate clean-energy-ny
#
name: clean-energy-ny
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - libgdal
  - proj
  - geos
  - pyyaml>=6.0
  - pandas>=2.2,<3
  - numpy>=2.0,<3
  - pyarrow>=16
  - openpyxl>=3.1
  - geopandas>=1.0
  - rasterio>=1.4
  - rasterstats>=0.20
  - pyproj>=3.6
  - shapely>=2.0
  - pyogrio>=0.10
  - affine>=2.4
  - scikit-learn>=1.5
  - xgboost>=2.0
  - polars>=1.0
  - matplotlib>=3.8
  - seaborn>=0.13
  - plotly>=5.0
  - scipy>=1.14
  - requests>=2.31
  - joblib>=1.4
  - jupyterlab>=4.0
  - ipykernel>=6.29
  - notebook>=7.0
  - nbconvert>=7.0
  - pip:
      - openmeteo-requests==1.3.0
      - requests-cache==1.2.1
      - retry-requests==2.0.0
